# Checks for pull requests and main: the license headers. Actions are pinned by
# commit SHA (version in the trailing comment), as the organization's workflow
# security scan requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or pull request supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boilerplate:
    name: License headers
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify/boilerplate.sh
